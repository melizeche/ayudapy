name: Tests

on:
  push:
    branches: [dev, master, main]
  pull_request:

# The suite only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayudapy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: secret-key-for-tests-only
      DEBUG: "False"
      DATABASE_URL: postgis://postgres:postgres@localhost:5432/ayudapy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Headless Chromium for the browser tests in core/tests/test_e2e.py.
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # --shuffle surfaces tests that only pass in a particular order.
      # Without Playwright the e2e tests are skipped, so make sure none were.
      - name: Run the test suite
        run: |
          set -o pipefail
          python manage.py test --shuffle -v 2 2>&1 | tee test-output.txt
          if grep -qE "test_e2e.*skipped" test-output.txt; then
            echo "::error::The browser (e2e) tests were skipped"
            exit 1
          fi
