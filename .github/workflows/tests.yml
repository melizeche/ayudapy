name: Tests

on:
  push:
    branches: [dev, master, main]
  pull_request:

# The suite only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest

    # Two jobs in parallel: the regular tests, and the browser tests, which
    # also depend on CDNs and Chromium. A failure in one does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            requirements: requirements.txt
            test_args: --exclude-tag=e2e
          - suite: e2e
            requirements: requirements-dev.txt
            test_args: --tag=e2e

    services:
      postgis:
        image: postgis/postgis:12-3.0  # same as production; chore/django-5.2 needs 14+
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayudapy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: secret-key-for-tests-only
      DEBUG: "False"
      DATABASE_URL: postgis://postgres:postgres@localhost:5432/ayudapy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      # Headless Chromium for the browser tests in core/tests/test_e2e.py.
      - name: Install Playwright browser
        if: matrix.suite == 'e2e'
        run: playwright install --with-deps chromium

      # --shuffle surfaces tests that only pass in a particular order.
      - name: Run the ${{ matrix.suite }} tests
        run: |
          set -o pipefail
          python manage.py test --shuffle -v 2 ${{ matrix.test_args }} 2>&1 | tee test-output.txt

      # Without Playwright the browser tests are skipped instead of failing,
      # so make sure they all ran.
      - name: Check that the browser tests ran
        if: matrix.suite == 'e2e'
        run: |
          if grep -qE "^Ran 0 tests" test-output.txt || grep -qE "test_e2e.*skipped" test-output.txt; then
            echo "::error::The browser (e2e) tests did not run"
            exit 1
          fi
