name: External assets

# Third-party JS/CSS can disappear without any push to this repository (see
# core/tests/test_external_assets.py), so this check also runs on a schedule.
# GitHub emails the workflow's last editor when a scheduled run fails.
on:
  schedule:
    - cron: "0 11 * * *"  # daily, 08:00 in Paraguay
  workflow_dispatch:
  pull_request:
    paths:
      - "conf/settings.py"
      - "templates/**"
      - "core/tests/test_external_assets.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:12-3.0  # same as production; chore/django-5.2 needs 14+
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayudapy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: secret-key-for-tests-only
      DEBUG: "False"
      DATABASE_URL: postgis://postgres:postgres@localhost:5432/ayudapy
      CHECK_EXTERNAL_ASSETS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch every external script and stylesheet
        run: python manage.py test core.tests.test_external_assets -v 2
